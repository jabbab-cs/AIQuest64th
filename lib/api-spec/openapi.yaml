openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Tahaqqaq applications and local review actions
servers:
  - url: /api
paths:
  /applications/{id}/screen:
    post:
      operationId: screenProjectApplication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Bank-triggered screening started or already processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectScreening" }
        "200":
          description: Existing completed screening reused without another AI call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectScreening" }
  /applications/{id}/screening:
    get:
      operationId: getProjectScreening
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Project-specific screening, suggestions and confirmation-gated results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectScreening" }
  /applications/{id}/screening/confirm:
    post:
      operationId: confirmProjectEvidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectEvidenceConfirmation" }
      responses:
        "200":
          description: Saved confirmation state and recalculated results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectScreening" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /applications:
    get:
      operationId: listApplications
      responses:
        "200":
          description: All applications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Pending application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /applications/{id}:
    get:
      operationId: getApplication
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Application with its own files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /applications/{id}/complete-screening:
    post:
      operationId: completeDemoScreening
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Demo case with evidence requested status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /demo/reset:
    post:
      operationId: resetDemo
      responses:
        "200":
          description: Number of demo submissions removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer }
  /uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Presigned PDF upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTarget"
  /applications/{id}/requests:
    get:
      operationId: listEvidenceRequests
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Locally recorded requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceRequest"
    post:
      operationId: recordEvidenceRequest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceRequestInput"
      responses:
        "201":
          description: Request recorded locally, no email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRequest"
components:
  schemas:
    ProjectEvidenceConfirmation:
      type: object
      required: [itemIds, confirmed]
      properties:
        itemIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
        confirmed: { type: boolean }
    ProjectScreening:
      type: object
      required: [kind, version, applicationId, status, startedAt, completedAt, updatedAt, model, error, files, suggestions, requirementMatches, results]
      properties:
        kind: { type: string, enum: [project] }
        version: { type: integer }
        applicationId: { type: string }
        status: { type: string, enum: [pending, processing, complete, error] }
        startedAt: { type: [string, "null"] }
        completedAt: { type: [string, "null"] }
        updatedAt: { type: string }
        model: { type: string }
        error: { type: [string, "null"] }
        files: { type: array, items: { type: object, additionalProperties: true } }
        suggestions: { type: array, items: { type: object, additionalProperties: true } }
        requirementMatches: { type: array, items: { type: object, additionalProperties: true } }
        results: { type: object, additionalProperties: true }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ApplicationFile:
      type: object
      required: [id, name, size, url, category, pages, quality, text]
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer }
        url: { type: string }
        category: { type: string, enum: [screening, credit, aside, received] }
        pages: { type: integer }
        quality: { type: string }
        text: { type: string }
    Application:
      type: object
      required: [id, university, title, description, location, status, isReference, isDemo, screeningData, createdAt, files]
      properties:
        id: { type: string }
        university: { type: string }
        institutionType: { type: string, nullable: true }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        status: { type: string, enum: [Pending, New, "Evidence requested", "Screened: evidence requested", Qualified, Rejected, Approved, Verifying, Paid] }
        isReference: { type: boolean }
        isDemo: { type: boolean }
        screeningData:
          type: object
          nullable: true
          additionalProperties: true
        createdAt: { type: string }
        files:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationFile"
    FileInput:
      type: object
      required: [name, size, objectPath]
      properties:
        name: { type: string }
        size: { type: integer }
        objectPath: { type: string }
    ApplicationInput:
      type: object
      required: [university, title, description, files]
      properties:
        university: { type: string, minLength: 1, maxLength: 120 }
        institutionType: { type: string, nullable: true, enum: [University, School, Hospital, Hotel, Factory, Company, Other, null] }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 15, maxLength: 3000 }
        files:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/FileInput"
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer, minimum: 1, maximum: 15728640 }
        contentType: { type: string }
    UploadTarget:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    EvidenceRequestInput:
      type: object
      required: [reviewer, reason]
      properties:
        reviewer: { type: string, minLength: 1, maxLength: 120 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    EvidenceRequest:
      type: object
      required: [id, applicationId, reviewer, reason, createdAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        reviewer: { type: string }
        reason: { type: string }
        createdAt: { type: string }